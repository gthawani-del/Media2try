<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TEZZ — Switch On.</title>
<meta name="description" content="TEZZ cinematic product experience." />
<style>
:root{--yellow:#ffd326;--white:#f5f5ef;--muted:rgba(255,255,255,.42);--black:#030303}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif}body{overscroll-behavior:none;touch-action:none}button{font:inherit}.stage{position:fixed;inset:0;overflow:hidden;background:var(--black);isolation:isolate}
.video-layer{position:absolute;inset:0;opacity:0;transform:scale(1.008);filter:blur(2px);transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1),filter .7s ease;pointer-events:none;will-change:opacity,transform,filter}.video-layer.active{opacity:1;transform:scale(1);filter:blur(0)}video{width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#030303}.shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 42%,rgba(0,0,0,.30))}.grain{position:absolute;inset:-35%;z-index:4;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");animation:grain .45s steps(2) infinite}@keyframes grain{0%{transform:translate(0)}50%{transform:translate(1.5%,-1%)}100%{transform:translate(-1%,1.5%)}}
.flash{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent 0 44%,rgba(255,211,38,.15) 50%,transparent 56%)}.flash.go{animation:flash .42s cubic-bezier(.2,.8,.2,1)}@keyframes flash{0%{opacity:0;transform:translateX(-18%)}28%{opacity:.9}100%{opacity:0;transform:translateX(18%)}}
.copy{position:absolute;inset:0;z-index:8;pointer-events:none}.message{position:absolute;opacity:0;transition:opacity .5s ease,transform .6s cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}.message.show{opacity:1}.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:9px;font-weight:800;letter-spacing:.22em;color:rgba(255,255,255,.72)}.eyebrow::before{content:"";width:22px;height:2px;background:var(--yellow)}.hero-copy{left:6vw;bottom:8vh;transform:translateY(24px)}.hero-copy.show{transform:translateY(0)}.hero-copy h1,.final-copy h1{margin:10px 0 0;font-family:Impact,'Arial Narrow Bold',Arial,sans-serif;font-size:clamp(72px,12vw,176px);line-height:.76;letter-spacing:-.045em;font-weight:900;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.22)}.hero-copy p,.final-copy p{margin:16px 0 0;font-size:clamp(17px,1.8vw,28px);letter-spacing:.22em;font-weight:800}.marker{position:relative;display:inline-block;z-index:0}.marker::before{content:"";position:absolute;left:-3%;right:-3%;bottom:.08em;height:.30em;background:var(--yellow);z-index:-1;transform:rotate(-1deg)}.micro{margin-top:14px;font-size:8px;letter-spacing:.20em;font-weight:700;color:rgba(255,255,255,.52)}
.charge-copy{left:6vw;top:50%;transform:translateY(calc(-50% + 28px))}.charge-copy.show{transform:translateY(-50%)}.charge-copy .word{display:block;width:max-content;font-family:Impact,'Arial Narrow Bold',Arial,sans-serif;font-size:clamp(46px,7.5vw,112px);font-weight:900;line-height:.80;letter-spacing:-.03em;text-transform:uppercase}.charge-copy .word:nth-child(2){margin-left:5vw}.charge-copy .word:nth-child(3){margin-left:2vw}.charge-copy .word:nth-child(4){margin-left:7vw}.charge-copy .word.hot{position:relative}.charge-copy .word.hot::after{content:"";position:absolute;left:0;right:0;bottom:.05em;height:.16em;background:var(--yellow);z-index:-1}.charge-copy .eyebrow{margin-bottom:14px}
.release-copy{right:6vw;top:12vh;width:min(48vw,720px);text-align:right;transform:translateY(28px)}.release-copy.show{transform:translateY(0)}.release-copy .eyebrow{justify-content:flex-end;margin-bottom:14px}.release-copy .headline{font-family:Impact,'Arial Narrow Bold',Arial,sans-serif;font-size:clamp(44px,6.4vw,98px);font-weight:900;letter-spacing:-.03em;line-height:.82;text-transform:uppercase}.release-copy .headline .marker::before{height:.18em;bottom:.04em}
.final-copy{left:6vw;bottom:7vh;transform:translateY(28px)}.final-copy.show{transform:translateY(0)}.final-copy .eyebrow{opacity:.65}.final-copy .cta{display:inline-block;margin-top:24px;padding:0 0 5px;border-bottom:2px solid var(--yellow);font-size:11px;font-weight:900;letter-spacing:.17em;color:#fff}.final-copy .micro{opacity:.65}
.rail{position:absolute;right:max(16px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:15px;align-items:flex-end}.rail button{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.36);padding:3px 0;display:flex;align-items:center;gap:8px;cursor:pointer;letter-spacing:.14em;font-size:9px;font-weight:800;transition:color .25s ease,transform .25s ease}.rail button::before{content:"";width:12px;height:1px;background:currentColor;transition:width .25s ease,background .25s ease}.rail button.active{color:#fff;transform:translateX(-3px)}.rail button.active::before{width:30px;height:2px;background:var(--yellow)}.rail .label{opacity:0;max-width:0;overflow:hidden;white-space:nowrap;transition:opacity .22s ease,max-width .28s ease}.rail button:hover .label,.rail button.active .label{opacity:1;max-width:70px}
.sound{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:30;appearance:none;border:0;background:transparent;color:rgba(255,255,255,.72);padding:5px;font-size:9px;font-weight:800;letter-spacing:.12em;cursor:pointer;display:flex;align-items:center;gap:7px}.sound::before{content:"◖";font-size:13px;color:var(--yellow)}.sound.on::before{content:"◖)))";font-size:10px}.sound:hover{color:#fff}.sound-prompt{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(48px,calc(env(safe-area-inset-top) + 42px));z-index:25;color:rgba(255,255,255,.75);font-size:8px;font-weight:800;letter-spacing:.16em;pointer-events:none;transition:opacity .35s ease}.sound-prompt::before{content:"";display:inline-block;width:14px;height:2px;background:var(--yellow);margin-right:7px;vertical-align:middle}.sound-prompt.hide{opacity:0}.hint{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;font-size:8px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.34);white-space:nowrap}
@media(max-width:700px){.hero-copy,.final-copy,.charge-copy{left:5.5vw}.release-copy{right:5.5vw;top:9vh;width:72vw}.rail{right:9px;gap:13px}.rail .label{display:none}.rail button::before{width:9px}.rail button.active::before{width:20px}.sound{right:10px;top:max(10px,env(safe-area-inset-top))}.sound-prompt{right:10px;top:max(40px,calc(env(safe-area-inset-top) + 36px))}.micro{font-size:7px}.hint{font-size:7px}}
@media(prefers-reduced-motion:reduce){.video-layer,.message,.rail button{transition:none}.grain{animation:none}.flash{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="TEZZ cinematic product experience">
<div class="video-layer active"><video id="v1" src="./Tezz%20video1.mp4" muted playsinline preload="auto"></video></div>
<div class="video-layer"><video id="v2" src="./Tezz%20video%202.mp4" muted playsinline preload="auto"></video></div>
<div class="video-layer"><video id="v3" src="./Tezz%20video3.mp4" muted playsinline preload="auto"></video></div>
<div class="video-layer"><video id="v4" src="./Tezz%20video4.mp4" muted playsinline preload="auto"></video></div>
<div class="shade"></div><div class="grain"></div><div class="flash" id="flash"></div>
<div class="copy" aria-hidden="true">
  <div class="message hero-copy show" id="m1"><span class="eyebrow">01 / REVEAL</span><h1>TEZZ</h1><p>SWITCH <span class="marker">ON.</span></p><div class="micro">250 ML / ENERGY SYSTEM</div></div>
  <div class="message charge-copy" id="m2"><span class="eyebrow">02 / CHARGE</span><span class="word">HIGHER</span><span class="word hot">FURTHER</span><span class="word">FASTER</span><span class="word">BRIGHTER</span></div>
  <div class="message release-copy" id="m3"><span class="eyebrow">03 / RELEASE</span><div class="headline">UNLEASH THE <span class="marker">CHARGE</span></div></div>
  <div class="message final-copy" id="m4"><span class="eyebrow">04 / HERO</span><h1>TEZZ</h1><p>SWITCH <span class="marker">ON.</span></p><span class="cta">TRY TEZZ</span></div>
</div>
<button class="sound" id="soundButton" aria-pressed="false">ON</button><div class="sound-prompt" id="soundPrompt">TAP FOR SOUND</div>
<nav class="rail" aria-label="TEZZ chapters">
<button class="active" data-index="0" aria-label="Reveal"><span>01</span><span class="label">REVEAL</span></button>
<button data-index="1" aria-label="Charge"><span>02</span><span class="label">CHARGE</span></button>
<button data-index="2" aria-label="Release"><span>03</span><span class="label">RELEASE</span></button>
<button data-index="3" aria-label="Hero"><span>04</span><span class="label">HERO</span></button>
</nav><div class="hint">SWIPE · WHEEL · TAP</div>
</main>
<script>
const videos=[v1,v2,v3,v4],layers=[...document.querySelectorAll('.video-layer')],messages=[m1,m2,m3,m4],buttons=[...document.querySelectorAll('.rail button')],soundButton=document.getElementById('soundButton'),soundPrompt=document.getElementById('soundPrompt'),flash=document.getElementById('flash');
let active=0,switching=false,touchStartY=0,wheelLock=false,soundOn=sessionStorage.getItem('tezzSound')==='on',messageTimer=null;
videos.forEach((video,i)=>{video.playsInline=true;video.muted=!soundOn;video.volume=1;video.pause();if(i!==0)video.currentTime=0});
function syncSoundUI(){soundButton.textContent=soundOn?'OFF':'ON';soundButton.classList.toggle('on',soundOn);soundButton.setAttribute('aria-pressed',String(soundOn));soundPrompt.classList.toggle('hide',soundOn);videos.forEach(v=>v.muted=!soundOn)}
function playFromStart(video){try{video.currentTime=0}catch(e){}video.muted=!soundOn;const p=video.play();if(p&&p.catch)p.catch(()=>{})}
function fireFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
function showMessage(index,delay=180){clearTimeout(messageTimer);messages.forEach(m=>m.classList.remove('show'));messageTimer=setTimeout(()=>messages[index].classList.add('show'),delay)}
function goTo(index){index=Math.max(0,Math.min(videos.length-1,index));if(index===active||switching)return;switching=true;const old=active;active=index;videos[old].pause();fireFlash();layers.forEach((layer,i)=>layer.classList.toggle('active',i===index));buttons.forEach((button,i)=>button.classList.toggle('active',i===index));showMessage(index,index===3?420:180);playFromStart(videos[index]);setTimeout(()=>{switching=false},720)}
async function enableSound(){soundOn=true;sessionStorage.setItem('tezzSound','on');syncSoundUI();try{await videos[active].play()}catch(e){}}
function disableSound(){soundOn=false;sessionStorage.setItem('tezzSound','off');syncSoundUI()}
soundButton.addEventListener('click',e=>{e.stopPropagation();soundOn?disableSound():enableSound()});buttons.forEach(button=>button.addEventListener('click',()=>goTo(Number(button.dataset.index))));
window.addEventListener('wheel',e=>{e.preventDefault();if(wheelLock||switching||Math.abs(e.deltaY)<8)return;wheelLock=true;goTo(active+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,900)},{passive:false});
window.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});window.addEventListener('touchend',e=>{const dy=touchStartY-e.changedTouches[0].clientY;if(Math.abs(dy)>42)goTo(active+(dy>0?1:-1))},{passive:true});
window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown','ArrowRight'].includes(e.key))goTo(active+1);if(['ArrowUp','PageUp','ArrowLeft'].includes(e.key))goTo(active-1);if(e.key==='Home')goTo(0);if(e.key==='End')goTo(3)});
if(matchMedia('(pointer:fine)').matches){window.addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);const msg=messages[active];if(msg.classList.contains('show'))msg.style.translate=`${x*4}px ${y*3}px`})}
syncSoundUI();const firstPlay=videos[0].play();if(firstPlay&&firstPlay.catch)firstPlay.catch(()=>{});window.addEventListener('pointerdown',()=>{if(videos[active].paused)videos[active].play().catch(()=>{})},{once:true});
</script>
</body>
</html>
