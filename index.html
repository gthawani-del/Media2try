<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TEZZ — Switch On.</title>
<meta name="description" content="TEZZ cinematic product experience." />
<style>
:root{--yellow:#ffd326;--white:#f5f5ef;--muted:rgba(255,255,255,.42);--black:#030303}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif}body{overscroll-behavior:none;touch-action:none}button{font:inherit}.stage{position:fixed;inset:0;overflow:hidden;background:var(--black);isolation:isolate}
.video-layer{position:absolute;inset:0;opacity:0;transform:scale(1.006);filter:blur(1.5px);transition:opacity .65s cubic-bezier(.22,.61,.36,1),transform .9s cubic-bezier(.22,.61,.36,1),filter .65s ease;pointer-events:none;will-change:opacity,transform,filter}.video-layer.active{opacity:1;transform:scale(1);filter:blur(0)}video{width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#030303}.shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,0) 42%,rgba(0,0,0,.26))}.grain{position:absolute;inset:-35%;z-index:4;pointer-events:none;opacity:.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");animation:grain .5s steps(2) infinite}@keyframes grain{0%{transform:translate(0)}50%{transform:translate(1.5%,-1%)}100%{transform:translate(-1%,1.5%)}}
.flash{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent 0 46%,rgba(255,211,38,.12) 50%,transparent 54%)}.flash.go{animation:flash .38s cubic-bezier(.2,.8,.2,1)}@keyframes flash{0%{opacity:0;transform:translateX(-14%)}30%{opacity:.8}100%{opacity:0;transform:translateX(14%)}}
.copy{position:absolute;inset:0;z-index:8;pointer-events:none}.message{position:absolute;opacity:0;transition:opacity .48s ease,transform .58s cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}.message.show{opacity:1}.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:9px;font-weight:800;letter-spacing:.22em;color:rgba(255,255,255,.70);white-space:nowrap}.eyebrow::before{content:"";width:22px;height:2px;background:var(--yellow);flex:none}.hero-copy{left:6vw;bottom:8vh;transform:translateY(22px)}.hero-copy.show{transform:translateY(0)}.hero-copy h1,.final-copy h1{margin:10px 0 0;font-family:Impact,'Arial Narrow Bold',Arial,sans-serif;font-size:clamp(72px,12vw,176px);line-height:.76;letter-spacing:-.035em;font-weight:900;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.22)}.hero-copy p,.final-copy p{margin:16px 0 0;font-size:clamp(17px,1.8vw,28px);letter-spacing:.20em;font-weight:800}.marker{position:relative;display:inline-block;z-index:0}.marker::before{content:"";position:absolute;left:-2%;right:-2%;bottom:.08em;height:.22em;background:var(--yellow);z-index:-1;transform:rotate(-1deg)}.micro{margin-top:14px;font-size:8px;letter-spacing:.20em;font-weight:700;color:rgba(255,255,255,.48)}
.charge-copy{left:6vw;top:50%;transform:translateY(calc(-50% + 26px))}.charge-copy.show{transform:translateY(-50%)}.charge-copy .word{display:block;width:max-content;font-family:Impact,'Arial Narrow Bold',Arial,sans-serif;font-size:clamp(46px,7.5vw,112px);font-weight:900;line-height:.82;letter-spacing:-.02em;text-transform:uppercase}.charge-copy .word:nth-child(2){margin-left:4vw}.charge-copy .word:nth-child(3){margin-left:1vw}.charge-copy .word:nth-child(4){margin-left:5vw}.charge-copy .word.hot{position:relative}.charge-copy .word.hot::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.11em;background:var(--yellow);z-index:-1}.charge-copy .eyebrow{margin-bottom:14px}
.release-copy{right:6vw;top:12vh;width:min(46vw,680px);text-align:right;transform:translateY(26px)}.release-copy.show{transform:translateY(0)}.release-copy .eyebrow{justify-content:flex-end;margin-bottom:14px}.release-copy .headline{font-family:Impact,'Arial Narrow Bold',Arial,sans-serif;font-size:clamp(42px,6vw,92px);font-weight:900;letter-spacing:-.02em;line-height:.84;text-transform:uppercase}.release-copy .headline .marker::before{height:.13em;bottom:.04em}
.final-copy{left:6vw;bottom:7vh;transform:translateY(26px)}.final-copy.show{transform:translateY(0)}.final-copy .eyebrow{opacity:.62}.final-copy .cta{display:inline-block;margin-top:22px;padding:0 0 5px;border-bottom:2px solid var(--yellow);font-size:11px;font-weight:900;letter-spacing:.17em;color:#fff}
.rail{position:absolute;right:max(16px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:15px;align-items:flex-end}.rail button{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.34);padding:3px 0;display:flex;align-items:center;gap:8px;cursor:pointer;letter-spacing:.14em;font-size:9px;font-weight:800;transition:color .25s ease,transform .25s ease}.rail button::before{content:"";width:12px;height:1px;background:currentColor;transition:width .25s ease,background .25s ease}.rail button.active{color:#fff;transform:translateX(-3px)}.rail button.active::before{width:28px;height:2px;background:var(--yellow)}.rail .label{opacity:0;max-width:0;overflow:hidden;white-space:nowrap;transition:opacity .22s ease,max-width .28s ease}.rail button:hover .label,.rail button.active .label{opacity:1;max-width:70px}
.sound{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:30;appearance:none;border:0;background:transparent;color:rgba(255,255,255,.72);padding:5px;font-size:9px;font-weight:800;letter-spacing:.12em;cursor:pointer;display:flex;align-items:center;gap:7px}.sound::before{content:"◖";font-size:13px;color:var(--yellow)}.sound.on::before{content:"◖)))";font-size:10px}.sound-prompt{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(48px,calc(env(safe-area-inset-top) + 42px));z-index:25;color:rgba(255,255,255,.70);font-size:8px;font-weight:800;letter-spacing:.16em;pointer-events:none;transition:opacity .35s ease}.sound-prompt::before{content:"";display:inline-block;width:14px;height:2px;background:var(--yellow);margin-right:7px;vertical-align:middle}.sound-prompt.hide{opacity:0}.hint{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;font-size:8px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.30);white-space:nowrap}
@media(max-width:700px){
.hero-copy{left:6vw;bottom:8.5vh;max-width:62vw}.hero-copy h1{font-size:clamp(64px,20vw,92px)}.hero-copy p{font-size:15px}.hero-copy .micro{display:none}
.charge-copy{left:7vw;top:54%;max-width:58vw}.charge-copy .eyebrow{margin-bottom:10px}.charge-copy .word{font-size:clamp(43px,13.5vw,64px);line-height:.83;letter-spacing:-.015em}.charge-copy .word:nth-child(2),.charge-copy .word:nth-child(3),.charge-copy .word:nth-child(4){margin-left:0}
.release-copy{right:7vw;top:10.5vh;width:58vw}.release-copy .headline{font-size:clamp(42px,12.2vw,58px);line-height:.84}.release-copy .eyebrow{margin-bottom:10px}
.final-copy{left:6vw;bottom:7.5vh;max-width:55vw}.final-copy h1{font-size:clamp(68px,20vw,94px)}.final-copy p{font-size:15px;letter-spacing:.18em}.final-copy .cta{font-size:10px;margin-top:20px}
.eyebrow{font-size:8px;letter-spacing:.18em}.eyebrow::before{width:17px}.rail{right:9px;gap:14px}.rail .label{display:none}.rail button{font-size:8px}.rail button::before{width:8px}.rail button.active::before{width:18px}.sound{right:10px;top:max(10px,env(safe-area-inset-top))}.sound-prompt{right:10px;top:max(40px,calc(env(safe-area-inset-top) + 36px))}.hint{font-size:7px}}
@media(prefers-reduced-motion:reduce){.video-layer,.message,.rail button{transition:none}.grain{animation:none}.flash{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="TEZZ cinematic product experience">
<div class="video-layer active"><video id="v1" src="./Tezz%20video1.mp4" muted playsinline preload="auto"></video></div>
<div class="video-layer"><video id="v2" src="./Tezz%20video%202.mp4" muted playsinline preload="auto"></video></div>
<div class="video-layer"><video id="v3" src="./Tezz%20video3.mp4" muted playsinline preload="auto"></video></div>
<div class="video-layer"><video id="v4" src="./Tezz%20video4.mp4" muted playsinline preload="auto"></video></div>
<div class="shade"></div><div class="grain"></div><div class="flash" id="flash"></div>
<div class="copy" aria-hidden="true">
<div class="message hero-copy" id="m1"><span class="eyebrow">01 / REVEAL</span><h1>TEZZ</h1><p>SWITCH <span class="marker">ON.</span></p><div class="micro">250 ML / ENERGY SYSTEM</div></div>
<div class="message charge-copy" id="m2"><span class="eyebrow">02 / CHARGE</span><span class="word">HIGHER</span><span class="word hot">FURTHER</span><span class="word">FASTER</span><span class="word">BRIGHTER</span></div>
<div class="message release-copy" id="m3"><span class="eyebrow">03 / RELEASE</span><div class="headline">UNLEASH THE <span class="marker">CHARGE</span></div></div>
<div class="message final-copy" id="m4"><span class="eyebrow">04 / HERO</span><h1>TEZZ</h1><p>SWITCH <span class="marker">ON.</span></p><span class="cta">TRY TEZZ</span></div>
</div>
<button class="sound" id="soundButton" aria-pressed="false">ON</button><div class="sound-prompt" id="soundPrompt">TAP FOR SOUND</div>
<nav class="rail" aria-label="TEZZ chapters">
<button class="active" data-index="0" aria-label="Reveal"><span>01</span><span class="label">REVEAL</span></button>
<button data-index="1" aria-label="Charge"><span>02</span><span class="label">CHARGE</span></button>
<button data-index="2" aria-label="Release"><span>03</span><span class="label">RELEASE</span></button>
<button data-index="3" aria-label="Hero"><span>04</span><span class="label">HERO</span></button>
</nav><div class="hint">SWIPE · SELECT</div>
</main>
<script>
const videos=[v1,v2,v3,v4],layers=[...document.querySelectorAll('.video-layer')],messages=[m1,m2,m3,m4],buttons=[...document.querySelectorAll('.rail button')],soundButton=document.getElementById('soundButton'),soundPrompt=document.getElementById('soundPrompt'),flash=document.getElementById('flash');
let active=0,switching=false,touchStartY=0,wheelLock=false,soundOn=sessionStorage.getItem('tezzSound')==='on',messageTimer=null,started=false;
videos.forEach(video=>{video.playsInline=true;video.muted=!soundOn;video.volume=1;video.pause();try{video.currentTime=0}catch(e){}});
function syncSoundUI(){soundButton.textContent=soundOn?'OFF':'ON';soundButton.classList.toggle('on',soundOn);soundButton.setAttribute('aria-pressed',String(soundOn));soundPrompt.classList.toggle('hide',soundOn);videos.forEach(v=>v.muted=!soundOn)}
function playFromStart(video){try{video.currentTime=0}catch(e){}video.muted=!soundOn;const p=video.play();if(p&&p.catch)p.catch(()=>{})}
function fireFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
function showMessage(index,delay){clearTimeout(messageTimer);messages.forEach(m=>m.classList.remove('show'));messageTimer=setTimeout(()=>messages[index].classList.add('show'),delay)}
function activate(index,play=true){index=Math.max(0,Math.min(videos.length-1,index));const old=active;active=index;videos.forEach((v,i)=>{if(i!==index)v.pause()});if(old!==index)fireFlash();layers.forEach((layer,i)=>layer.classList.toggle('active',i===index));buttons.forEach((button,i)=>button.classList.toggle('active',i===index));showMessage(index,index===3?650:260);if(play)playFromStart(videos[index])}
function startExperience(){if(started)return;started=true;soundPrompt.classList.add('hide');activate(0,true)}
function goTo(index){index=Math.max(0,Math.min(videos.length-1,index));if(switching)return;if(!started){started=true;soundPrompt.classList.add('hide')}switching=true;activate(index,true);setTimeout(()=>switching=false,680)}
function advanceFromEnded(index){if(index!==active||!started)return;if(index<videos.length-1){setTimeout(()=>goTo(index+1),180)}else{showMessage(3,120)}}
videos.forEach((video,i)=>video.addEventListener('ended',()=>advanceFromEnded(i)));
async function enableSound(){soundOn=true;sessionStorage.setItem('tezzSound','on');syncSoundUI();if(!started)startExperience();try{await videos[active].play()}catch(e){}}
function disableSound(){soundOn=false;sessionStorage.setItem('tezzSound','off');syncSoundUI()}
soundButton.addEventListener('click',e=>{e.stopPropagation();soundOn?disableSound():enableSound()});
buttons.forEach(button=>button.addEventListener('click',e=>{e.stopPropagation();goTo(Number(button.dataset.index))}));
window.addEventListener('wheel',e=>{e.preventDefault();if(wheelLock||switching||Math.abs(e.deltaY)<8)return;wheelLock=true;if(!started)startExperience();else goTo(active+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,900)},{passive:false});
window.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});window.addEventListener('touchend',e=>{const dy=touchStartY-e.changedTouches[0].clientY;if(Math.abs(dy)>42){if(!started)startExperience();else goTo(active+(dy>0?1:-1))}},{passive:true});
window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown','ArrowRight'].includes(e.key)){if(!started)startExperience();else goTo(active+1)}if(['ArrowUp','PageUp','ArrowLeft'].includes(e.key))goTo(active-1);if(e.key==='Home')goTo(0);if(e.key==='End')goTo(3)});
document.getElementById('stage').addEventListener('click',e=>{if(e.target.closest('button'))return;if(!started)startExperience()});
if(matchMedia('(pointer:fine)').matches){window.addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);const msg=messages[active];if(msg.classList.contains('show'))msg.style.translate=`${x*3}px ${y*2}px`})}
syncSoundUI();messages.forEach(m=>m.classList.remove('show'));
</script>
</body>
</html>
